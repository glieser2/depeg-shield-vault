name: Verify Intelligent Contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GenLayer Testing Suite
        run: python -m pip install --upgrade pip genlayer-test cloudpickle pytest
      - name: Run Direct-Mode Security & Consensus Suite
        run: pytest tests/ -v -W error::RuntimeWarning
